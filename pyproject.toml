[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-mindoff"
version = "0.8.0"
description = "Build production-ready Django REST APIs with native Polars support and built-in queueing."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "BSD-3-Clause"

authors = [
  { name = "Joel Samraj" }
]

keywords = [
  "django",
  "django-rest-framework",
  "drf",
  "api",
  "api-development",
  "code-generation",
  "scaffolding",
  "automation",
  "boilerplate",
  "cli"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]

dependencies = [
  "django>=5.0,<7.0",
]

[project.optional-dependencies]
internal = [
  "djangorestframework>=3.15.0,<4.0",
  "django-cors-headers>=4.4.0,<5.0",
  "python-decouple>=3.8,<4.0",
  "django-ratelimit>=4.1.0,<5.0",
  "pytest>=8.0,<10.0",
  "pytest-django>=4.8.0,<5.0",
  "model-bakery>=1.20.0,<2.0",
  "typeguard>=4.0,<5.0",
  "polars>=1.39.0,<2.0",
  "connectorx>=0.4.0,<0.5",
  "pandas>=2.2.0,<4.0",
  "sqlalchemy>=2.0.0,<3.0",
  "orjson>=3.10.0,<4.0",
  "pyarrow>=17.0.0,<26.0.0",
  "dramatiq>=1.17.0,<3.0",
  "redis>=5.0.0,<9.0.0",
]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5,<10.0",
  "mike>=2.0,<3.0",
  "pymdown-extensions>=10.0,<12.0",
]

[project.urls]
"Homepage" = "https://github.com/mindoffwork/django-mindoff"
"Documentation" = "https://django.mindoff.work/"
"Source" = "https://github.com/mindoffwork/django-mindoff.git"
"Issues" = "https://github.com/mindoffwork/django-mindoff/issues"
"Changelog" = "https://github.com/mindoffwork/django-mindoff/blob/root/CHANGELOG.md"

[project.scripts]
django-mindoff = "django_mindoff.cli:main"

[tool.coverage.run]
omit = [
  "apps/django_mindoff/tests/*",
  "apps/django_mindoff/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "apps"}

[tool.setuptools.packages.find]
where = ["apps"]
include = ["django_mindoff*"]
exclude = ["django_mindoff.tests*", "django_mindoff.*.tests*"]

[tool.setuptools.package-data]
django_mindoff = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = [
  "*.pyc",
  "*.pyo",
  "__pycache__",
]
