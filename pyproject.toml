[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-mindoff"
version = "0.1.3"
description = "Architectural framework for reliable, scalable Django REST APIs with native Polars."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "BSD-3-Clause"

authors = [
  { name = "Joel Samraj" }
]

keywords = [
  "django",
  "django-rest-framework",
  "drf",
  "api",
  "api-development",
  "code-generation",
  "scaffolding",
  "automation",
  "boilerplate",
  "cli"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]

dependencies = [
  "django>=5.0",
]

[project.optional-dependencies]
test = [
  "djangorestframework>=3.15.0",
  "polars>=1.33.0",
  "pandas",
  "sqlalchemy",
  "orjson",
  "pyarrow",
  "dramatiq",
  "redis",
  "python-decouple",
  "django-ratelimit",
  "pytest",
  "pytest-django",
  "model-bakery",
  "typeguard",
]

[project.urls]
"Homepage" = "https://github.com/mindoffwork/django-mindoff"
"Documentation" = "https://github.com/mindoffwork/django-mindoff#readme"
"Source" = "https://github.com/mindoffwork/django-mindoff.git"
"Issues" = "https://github.com/mindoffwork/django-mindoff/issues"
"Changelog" = "https://github.com/mindoffwork/django-mindoff/blob/main/CHANGELOG.md"

[project.scripts]
django-mindoff = "django_mindoff.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "apps"}

[tool.setuptools.packages.find]
where = ["apps"]
include = ["django_mindoff*"]
exclude = ["django_mindoff.tests*", "django_mindoff.*.tests*"]

[tool.setuptools.package-data]
django_mindoff = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = [
  "*.pyc",
  "*.pyo",
  "__pycache__",
]
