name: Root CI

on:
  push:
    branches:
      - root
    paths:
      - "apps/**"
      - "config/**"
      - "manage.py"
      - "mindoff.py"
      - "pytest.ini"
      - "pyproject.toml"

concurrency:
  group: root-stability-${{ github.sha }}
  cancel-in-progress: false # never cancel a stability run mid-flight

jobs:
  smoke-minimal:
    name: Smoke (minimal install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install minimal package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: CLI smoke check
        run: django-mindoff init --help

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      # Exercises the PostgreSQL write paths (COPY bulk load, staged-merge
      # upsert) that SQLite cannot reach. Tests skip themselves when the
      # MO_TEST_PG_* variables below are absent, so local runs stay SQLite-only.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mindoff_test
          POSTGRES_USER: mindoff
          POSTGRES_PASSWORD: mindoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DJANGO_SETTINGS_MODULE: apps.django_mindoff.tests.settings
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MO_TEST_PG_NAME: mindoff_test
      MO_TEST_PG_USER: mindoff
      MO_TEST_PG_PASSWORD: mindoff
      MO_TEST_PG_HOST: localhost
      MO_TEST_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[internal,postgres]"
          pip install pytest-cov
      - name: Django system checks
        run: python manage.py check --settings=apps.django_mindoff.tests.settings
      - name: Run migrations
        run: python manage.py migrate --noinput --settings=apps.django_mindoff.tests.settings
      - name: Run tests with coverage (min 90%)
        run: |
          pytest \
            --ds=apps.django_mindoff.tests.settings \
            --cov=apps.django_mindoff \
            --cov-report=xml \
            --cov-fail-under=90
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: root
          name: root-ci
          fail_ci_if_error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
