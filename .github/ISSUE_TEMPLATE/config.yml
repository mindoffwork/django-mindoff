# Issues are for things that are broken or wrong in the framework.
# Everything else (feature ideas, usage questions, "how do I…") belongs in Discussions.
blank_issues_enabled: false
contact_links:
  - name: ✨ Propose a feature or improvement
    url: https://github.com/mindoffwork/django-mindoff/discussions/new?category=ideas
    about: Feature ideas and improvement proposals go through Discussions, not Issues.
  - name: 💬 Questions & general discussion
    url: https://github.com/mindoffwork/django-mindoff/discussions
    about: Usage questions, feedback, or anything that isn't a bug or a doc error.
  - name: 🔒 Report a security vulnerability
    url: https://github.com/mindoffwork/django-mindoff/blob/root/SECURITY.md
    about: Please report vulnerabilities privately — do not open a public issue.
  - name: 📖 Official documentation
    url: https://django.mindoff.work
    about: Usage guides, API reference, and the contribution guide live here.
